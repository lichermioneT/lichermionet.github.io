# =========================================================
# Hexo Site Configuration
# =========================================================

# ---------------------------------------------------------
# Site
# ---------------------------------------------------------
title: Lichermione 的技术博客
subtitle: C++ · Linux · 网络编程 · 数据结构 · 读书
description: 记录 C++、Linux、网络编程、数据结构与数据库的学习过程，用项目验证理解。

keywords:
  - C++
  - Linux
  - 网络编程
  - 数据结构
  - 数据库

author: Lichermione
language: zh-CN
timezone: Asia/Shanghai


# ---------------------------------------------------------
# URL
# ---------------------------------------------------------
url: https://lichermionet.github.io
root: /

permalink: ':year/:month/:day/:title/'

pretty_urls:
  trailing_index: false
  trailing_html: false


# ---------------------------------------------------------
# Directory
# ---------------------------------------------------------
source_dir: source
public_dir: public

tag_dir: tags
archive_dir: archives
category_dir: categories

code_dir: downloads/code
i18n_dir: ':lang'


# ---------------------------------------------------------
# Writing
# ---------------------------------------------------------
new_post_name: ':title.md'
default_layout: post

titlecase: false

external_link:
  enable: true
  field: site
  exclude: ''

filename_case: 0

render_drafts: false

# 每篇文章允许拥有独立资源目录
post_asset_folder: true

relative_link: false

# 不生成未来时间的文章
future: false


# ---------------------------------------------------------
# Markdown
# ---------------------------------------------------------
marked:
  prependRoot: true
  postAsset: true


# ---------------------------------------------------------
# Syntax Highlight
# ---------------------------------------------------------
syntax_highlighter: highlight.js

highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false

prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''


# =========================================================
# 首页文章
# =========================================================
# 首页属于“时间流”
# 最新文章放在最前面

index_generator:
  path: ''
  per_page: 10
  order_by: -date


# =========================================================
# 分类
# =========================================================

default_category: 随笔

category_map:
  C++: cpp
  Linux: linux
  C 语言: c-language
  网络编程: network
  数据结构: data-structures
  设计模式: design-patterns
  数据库: database
  读书: reading

# 分类页仍然按照发布时间排序
category_generator:
  per_page: 10
  order_by: -date


# =========================================================
# 标签
# =========================================================

tag_map:
  C++: cpp
  Linux: linux

tag_generator:
  per_page: 10
  order_by: -date


# =========================================================
# Date / Time
# =========================================================

date_format: YYYY-MM-DD
time_format: HH:mm:ss

# Git 工作流下避免“文件修改时间”影响文章更新时间
updated_option: date


# =========================================================
# Pagination
# =========================================================

per_page: 10
pagination_dir: page


# =========================================================
# Theme
# =========================================================

theme: anzhiyu


# =========================================================
# Search
# =========================================================

search:
  path: search.xml
  field: post
  content: true
  format: html


# =========================================================
# Sitemap
# =========================================================

sitemap:
  path: sitemap.xml


# =========================================================
# RSS
# =========================================================

feed:
  type: atom
  path: atom.xml
  limit: 20
  content: true


# =========================================================
# Meta
# =========================================================

meta_generator: true